name: Daily Bing Wallpaper Fetcher

on:
  schedule:
    - cron: '0 19 * * *'
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # ★★★ 关键修复：获取完整历史，不只是最新提交 ★★★
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests pandas

      # ★★★ 新增：检查当前 source_list.csv 的内容 ★★★
      - name: Check current data
        run: |
          echo "📊 Current source_list.csv has $(wc -l < source_list.csv) lines"
          head -5 source_list.csv

      - name: Fetch latest wallpapers
        run: python main.py --no-html --no-history

      - name: Generate JSON data
        run: python generate_data.py

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source_list.csv data/wallpapers.json
          git diff --staged --quiet || git commit -m "Daily wallpaper update [skip ci]"
          git push
