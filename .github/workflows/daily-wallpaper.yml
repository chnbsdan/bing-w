name: Daily Bing Wallpaper Fetcher

on:
  # 定时触发：每天北京时间 8:00 运行 (UTC时间 0:00)
  schedule:
    - cron: '0 0 * * *'
  # 手动触发：方便随时测试
  workflow_dispatch:
  # 当 source_list.csv 被直接推送时也触发
  push:
    paths:
      - 'source_list.csv'

permissions:
  contents: write

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    
    steps:
      # ===== 1. 拉取代码 =====
      - name: Checkout code
        uses: actions/checkout@v4

      # ===== 2. 设置 Python 环境 =====
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ===== 3. 安装依赖 =====
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      # ===== 4. 获取最新壁纸数据（调用 main.py） =====
      - name: Fetch latest wallpapers
        run: python main.py --no-html --no-history
        continue-on-error: true  # 即使失败也继续（可能API暂时不可用）

      # ===== 5. 生成 JSON 数据（供前端和API使用） =====
      - name: Generate JSON data
        run: python generate_data.py

      # ===== 6. 提交并推送所有更新 =====
      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source_list.csv data/wallpapers.json
          git diff --staged --quiet || git commit -m "Daily wallpaper update [skip ci]"
          git push
