name: Daily Bing Wallpaper Fetcher

on:
  schedule:
    - cron: '0 19 * * *'
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  safe-fetch-and-merge:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests pandas

      # ★★★ 步骤1：只抓取，不合并 ★★★
      - name: Fetch only
        run: python fetch_only.py

      # ★★★ 步骤2：安全合并 ★★★
      - name: Safe merge
        run: python safe_merge.py

      # 步骤3：生成JSON
      - name: Generate JSON
        run: python generate_data.py

      # 步骤4：提交
      - name: Commit and push
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source_list.csv data/wallpapers.json
          git diff --staged --quiet || git commit -m "Daily wallpaper update [skip ci]"
          git push
