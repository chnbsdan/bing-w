name: Add Region Column to CSV

on:
  # 手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-region:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pandas
        run: pip install pandas

      - name: Run add_region.py
        run: python add_region.py

      - name: Commit and push result
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source_list_with_region.csv
          git diff --staged --quiet || git commit -m "Add region column to CSV [skip ci]"
          git push
